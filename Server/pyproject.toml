[project]
name = "aisbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "claude-agent-sdk>=0.2.182",
    "croniter>=7.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "httpx[http2]>=0.28.1",
    "openai-codex>=0.169.0",
    "pillow>=13.0.0",
    "uvicorn[standard]>=0.54.0",
    "vncdotool>=1.4.2",
    "websockets>=17.4",
    "zstandard>=0.23",
]

[project.scripts]
aisbot = "aisbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
